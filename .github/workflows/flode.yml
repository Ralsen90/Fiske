name: Hämta flöde
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta punkt 554
        run: |
          curl -sf --retry 3 -A "Mozilla/5.0 (fiskelogg)" "https://vattenwebb.smhi.se/hydronu/data/point?subid=554" -o ny.json
          python3 -c "import json;d=json.load(open('ny.json'));c=d['chartData'];json.dump({'productionTime':d.get('productionTime'),'chartData':{k:c.get(k) for k in ['mq','mlq','mhq','coutHindcast','coutForecast']}},open('flode.json','w'))"
          rm ny.json
      - name: Spara
        run: |
          git config user.name "flode-bot"
          git config user.email "flode-bot@users.noreply.github.com"
          git add flode.json
          git diff --cached --quiet || (git commit -m "Uppdatera flöde" && git push)
